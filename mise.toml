# Tool versions and the project's commands. uv still installs the packages; mise only
# picks its version and runs the tasks. Node, pnpm, and rclone join with the viewer.

[tools]
uv = "0.9.18"

[tasks.setup]
description = "Install the Python environment"
run = "uv sync"

[tasks.fetch]
description = "Download an area's sources into data/raw/<area>/"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru fetch --area ${usage_area}"

[tasks.plan]
description = "Write a top-down check to out/<area>/"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru plan --area ${usage_area}"

[tasks.prepare]
description = "Write data/derived/<area>.gpkg and its stats"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru prepare --area ${usage_area}"

[tasks.render]
description = "Write flat frame and full renders to out/<area>/"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru render --area ${usage_area}"

[tasks.swatches]
description = "Write the candidate palette sheet to out/<area>/"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru swatches --area ${usage_area}"

[tasks.detail]
description = "Write one near-final 2048 px frame per detail view to out/<area>/"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru detail --area ${usage_area}"

[tasks.frames]
description = "Render the four views as seamless 2048 px frames"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run bengaluru frames --area ${usage_area}"

[tasks.map]
description = "Render and tile one view at a time, deleting frames as it goes; resumes if stopped"
usage = 'arg "[area]" default="central"'
run = "caffeinate -i uv run bengaluru build --area ${usage_area}"

[tasks.tile]
description = "Build each view's Deep Zoom pyramid and the search index"
usage = 'arg "[area]" default="central"'
run = "uv run bengaluru tile --area ${usage_area}"

[tasks.night]
description = "Fetch, prepare, and build an area inside the 23:00 to 04:00 window; does nothing outside it"
usage = 'arg "[area]" default="vidhana-soudha"'
env = { PYTHONUNBUFFERED = "1" }
run = "caffeinate -is uv run bengaluru night --area ${usage_area}"

[tasks.schedule-on]
description = "Install the launchd agent that starts `mise run night` at 23:00"
run = [
  "mkdir -p logs",
  "cp launchd/com.oinam.bengaluru.night.plist ~/Library/LaunchAgents/",
  "launchctl bootout gui/$(id -u)/com.oinam.bengaluru.night 2>/dev/null || true",
  "launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.oinam.bengaluru.night.plist",
]

[tasks.schedule-off]
description = "Remove the launchd agent"
run = [
  "launchctl bootout gui/$(id -u)/com.oinam.bengaluru.night 2>/dev/null || true",
  "rm -f ~/Library/LaunchAgents/com.oinam.bengaluru.night.plist",
]

[tasks.four-views]
description = "Lay the four built views side by side in one PNG in out/<area>/"
usage = 'arg "[area]" default="vidhana-soudha"'
run = "uv run python tools/four_views.py ${usage_area}"
